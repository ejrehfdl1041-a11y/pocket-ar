<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>POCKET AR · JOYSTICK</title><style>*{box-sizing:border-box}body{margin:0;background:#1e1a20;color:white;font-family:system-ui,-apple-system,sans-serif}.app{max-width:560px;margin:auto;padding:14px}h1{font-size:22px;margin:8px 0}p{font-size:12px;color:#c9bdc8;line-height:1.6}.stage{height:72dvh;min-height:460px;max-height:790px;position:relative;overflow:hidden;border-radius:24px;background:radial-gradient(circle at 50% 40%,#f4dfe7,#a881a0)}video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}video{display:none}.top{position:absolute;top:14px;left:14px;background:#201922a8;padding:9px 12px;border-radius:99px;font-size:11px}.controls{position:absolute;bottom:20px;left:0;right:0;display:flex;align-items:end;justify-content:space-between;padding:0 17px;gap:10px}.action{border:1px solid #ffffff6b;background:#251e2ab8;color:white;padding:12px 10px;border-radius:15px;font-size:12px;min-width:65px}.joystick{width:142px;height:142px;border-radius:50%;background:#1d192255;border:2px solid #ffffff75;touch-action:none;position:relative;flex:none;box-shadow:inset 0 0 28px #0003}.joystick:before{content:'↖  ↑  ↗';position:absolute;top:12px;left:0;right:0;text-align:center;font-size:12px;color:#fff9}.stick{width:58px;height:58px;position:absolute;left:40px;top:40px;border-radius:50%;background:#fff9;box-shadow:0 5px 15px #0004;border:2px solid #fff;touch-action:none}.bottom{display:flex;gap:8px;justify-content:center;margin-top:13px}.pill{padding:10px 15px;border-radius:99px;background:#fff1;border:1px solid #fff3;color:#fff;font-size:12px}.pill.active{background:#ffc1da;color:#271a22}.note{font-size:11px;color:#bcb1bd;margin-top:12px}</style></head><body><main class="app"><h1>POCKET AR <span style="color:#ffb9d6">/ WALK</span></h1><p>조이스틱으로 리즈코를 움직여 봐. 이동할 때 몸이 통통 튀고 다리가 번갈아 움직이는 느낌을 시험하는 버전이야.</p><div class="stage" id="stage"><video id="video" autoplay playsinline muted></video><canvas id="scene"></canvas><div class="top" id="status">● 3D 테스트 모드</div><div class="controls"><button class="action" id="camera">카메라<br>켜기</button><div class="joystick" id="joy"><div class="stick" id="stick"></div></div><button class="action" id="reset">위치<br>초기화</button></div></div><div class="bottom"><button class="pill active" data-mode="punch">👊 팔 휘두르기</button><button class="pill" data-mode="idle">● 멈춰 있기</button></div><p class="note">이 버전은 조이스틱과 걷기 모션을 검증하는 카메라 합성 데모야. 실제 바닥을 인식해 공간에 고정하는 AR은 별도로 연결해야 해. HTTPS 배포 후 카메라 사용 가능.</p></main><script type="module">
import * as THREE from 'https://esm.sh/three@0.164.1';
import {GLTFLoader} from 'https://esm.sh/three@0.164.1/examples/jsm/loaders/GLTFLoader.js';
const stage=document.querySelector('#stage'),canvas=document.querySelector('#scene'),video=document.querySelector('#video');
const renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(37,1,.01,100);cam.position.set(0,2.5,7.8);cam.lookAt(0,1,0);scene.add(new THREE.HemisphereLight(0xffffff,0x6e415d,2.3));const light=new THREE.DirectionalLight(0xffffff,2.4);light.position.set(-2,6,4);scene.add(light);
const ground=new THREE.Mesh(new THREE.CircleGeometry(.9,40),new THREE.MeshBasicMaterial({color:0x33202d,transparent:true,opacity:.22}));ground.rotation.x=-Math.PI/2;scene.add(ground);
const holder=new THREE.Group();scene.add(holder);let character=null,mixer=null,mode='punch';const clock=new THREE.Clock();let px=0,pz=0,heading=0,walkPhase=0;
new GLTFLoader().load('./rizco_punch.glb',g=>{character=g.scene;holder.add(character);character.scale.setScalar(1);mixer=new THREE.AnimationMixer(character);if(g.animations.length){const action=mixer.clipAction(g.animations[0]);action.play()}document.querySelector('#status').textContent='● 리즈코 준비 완료'},undefined,()=>{document.querySelector('#status').textContent='모델 로딩 실패 · HTTPS 배포 확인'});
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}addEventListener('resize',resize);resize();
let vx=0,vy=0,pointer=null;const joy=document.querySelector('#joy'),stick=document.querySelector('#stick');function updateJoy(e){const r=joy.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),len=Math.hypot(dx,dy),max=40,ratio=len>max?max/len:1;const x=dx*ratio,y=dy*ratio;vx=x/max;vy=y/max;stick.style.transform=`translate(${x}px,${y}px)`}function release(){pointer=null;vx=vy=0;stick.style.transform='translate(0,0)'}joy.addEventListener('pointerdown',e=>{pointer=e.pointerId;joy.setPointerCapture(pointer);updateJoy(e)});joy.addEventListener('pointermove',e=>{if(e.pointerId===pointer)updateJoy(e)});joy.addEventListener('pointerup',release);joy.addEventListener('pointercancel',release);
document.querySelector('#reset').onclick=()=>{px=pz=heading=0};document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b))});
document.querySelector('#camera').onclick=async()=>{if(video.srcObject){video.srcObject.getTracks().forEach(t=>t.stop());video.srcObject=null;video.style.display='none';document.querySelector('#camera').innerHTML='카메라<br>켜기';return}try{video.srcObject=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});video.style.display='block';await video.play();document.querySelector('#camera').innerHTML='카메라<br>끄기'}catch(e){document.querySelector('#status').textContent='카메라 권한 또는 HTTPS를 확인해 줘'}};
function tick(){requestAnimationFrame(tick);const dt=Math.min(clock.getDelta(),.05),moving=Math.hypot(vx,vy)>.12;if(moving){px+=vx*dt*1.65;pz+=vy*dt*1.3;px=THREE.MathUtils.clamp(px,-2.4,2.4);pz=THREE.MathUtils.clamp(pz,-2,2);const desired=Math.atan2(vx,-vy);let diff=Math.atan2(Math.sin(desired-heading),Math.cos(desired-heading));heading+=diff*Math.min(1,dt*10);walkPhase+=dt*15}holder.position.set(px,0,pz);holder.rotation.y=heading;ground.position.set(px,-.015,pz);if(character){character.position.y=moving?Math.abs(Math.sin(walkPhase))*0.075:Math.sin(performance.now()/550)*.012;character.rotation.z=moving?Math.sin(walkPhase)*.055:(mode==='punch'?Math.sin(performance.now()/1000*15)*.085:0);character.rotation.x=(!moving&&mode==='punch')?Math.max(0,Math.sin(performance.now()/1000*15))*.075:0;if(mixer){mixer.timeScale=moving?.35:(mode==='punch'?1.55:0);mixer.update(dt)}}renderer.render(scene,cam)}tick();
</script></body></html>
