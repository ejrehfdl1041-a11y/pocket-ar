<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>POCKET AR · JOYSTICK</title><style>*{box-sizing:border-box}body{margin:0;background:#1e1a20;color:white;font-family:system-ui,-apple-system,sans-serif}.app{max-width:560px;margin:auto;padding:14px}h1{font-size:22px;margin:8px 0}p{font-size:12px;color:#c9bdc8;line-height:1.6}.stage{height:72dvh;min-height:460px;max-height:790px;position:relative;overflow:hidden;border-radius:24px;background:radial-gradient(circle at 50% 40%,#f4dfe7,#a881a0)}video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}video{display:none}.top{position:absolute;top:14px;left:14px;background:#201922a8;padding:9px 12px;border-radius:99px;font-size:11px}.controls{position:absolute;bottom:20px;left:0;right:0;display:flex;align-items:end;justify-content:space-between;padding:0 17px;gap:10px}.action{border:1px solid #ffffff6b;background:#251e2ab8;color:white;padding:12px 10px;border-radius:15px;font-size:12px;min-width:65px}.joystick{width:142px;height:142px;border-radius:50%;background:#1d192255;border:2px solid #ffffff75;touch-action:none;position:relative;flex:none;box-shadow:inset 0 0 28px #0003}.joystick:before{content:'↖  ↑  ↗';position:absolute;top:12px;left:0;right:0;text-align:center;font-size:12px;color:#fff9}.stick{width:58px;height:58px;position:absolute;left:40px;top:40px;border-radius:50%;background:#fff9;box-shadow:0 5px 15px #0004;border:2px solid #fff;touch-action:none}.bottom{display:flex;gap:8px;justify-content:center;margin-top:13px}.pill{padding:10px 15px;border-radius:99px;background:#fff1;border:1px solid #fff3;color:#fff;font-size:12px}.pill.active{background:#ffc1da;color:#271a22}.picker{display:flex;gap:7px;overflow-x:auto;margin-top:12px;padding:4px 0 8px}.pick{flex:0 0 auto;min-width:77px;border:1px solid #fff4;border-radius:14px;padding:9px 6px;background:#ffffff14;color:white;font-size:11px}.pick.active{background:#ffc1da;color:#30212a;border-color:#fff}.note{font-size:11px;color:#bcb1bd;margin-top:12px}</style></head><body><main class="app"><h1>POCKET AR <span style="color:#ffb9d6">/ WALK</span></h1><p>6종 캐릭터를 골라 조이스틱으로 움직여 봐! 모두 펀치할 수 있어 👊</p><div class="stage" id="stage"><video id="video" autoplay playsinline muted></video><canvas id="scene"></canvas><div class="top" id="status">● 3D 테스트 모드</div><div class="controls"><button class="action" id="camera">카메라<br>켜기</button><div class="joystick" id="joy"><div class="stick" id="stick"></div></div><button class="action" id="reset">위치<br>초기화</button></div></div><div class="picker" id="picker"></div><div class="bottom"><button class="pill active" data-mode="punch">👊 팔 휘두르기</button><button class="pill" data-mode="idle">● 멈춰 있기</button></div><p class="note">이 버전은 6종 3D 캐릭터와 펀치/걷기를 시험하는 카메라 합성 데모야. 추가된 5종은 단순화된 3D 시제품이야. 실제 바닥을 인식해 공간에 고정하는 AR은 별도로 연결해야 해. HTTPS 배포 후 카메라 사용 가능.</p></main><script type="module">
import * as THREE from 'https://esm.sh/three@0.164.1';
import {GLTFLoader} from 'https://esm.sh/three@0.164.1/examples/jsm/loaders/GLTFLoader.js';
const stage=document.querySelector('#stage'),canvas=document.querySelector('#scene'),video=document.querySelector('#video');
const renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(37,1,.01,100);cam.position.set(0,2.5,7.8);cam.lookAt(0,1,0);scene.add(new THREE.HemisphereLight(0xffffff,0x6e415d,2.3));const light=new THREE.DirectionalLight(0xffffff,2.4);light.position.set(-2,6,4);scene.add(light);
const ground=new THREE.Mesh(new THREE.CircleGeometry(.9,40),new THREE.MeshBasicMaterial({color:0x33202d,transparent:true,opacity:.22}));ground.rotation.x=-Math.PI/2;scene.add(ground);
const holder=new THREE.Group();scene.add(holder);let character=null,mixer=null,mode='punch',selected='rizco',rig=null;const clock=new THREE.Clock();let px=0,pz=0,heading=0,walkPhase=0;
const names=[['rizco','🐻','리즈코'],['song','⚪','송용돌이'],['deer','🦌','우락밤'],['cat','🐈‍⬛','토냥덕'],['duck','🐤','똘병'],['dog','🐶','멍냥이']];
const picker=document.querySelector('#picker');names.forEach(([id,emoji,name])=>{const b=document.createElement('button');b.className='pick'+(id==='rizco'?' active':'');b.textContent=emoji+' '+name;b.onclick=()=>choose(id);picker.append(b)});
const mat=(hex)=>new THREE.MeshStandardMaterial({color:hex,roughness:0.94,metalness:0});
const mats={white:mat('#fff9f2'),cream:mat('#f7d5b4'),gray:mat('#a9a9ad'),brown:mat('#5b3326'),pink:mat('#f8a5ad'),dark:mat('#36323f'),black:mat('#181820'),yellow:mat('#ffcf4d'),red:mat('#e83e53'),orange:mat('#f3a331')};
function oval(parent,m,x,y,z,sx,sy,sz){const o=new THREE.Mesh(new THREE.SphereGeometry(1,20,14),m);o.position.set(x,y,z);o.scale.set(sx,sy,sz);parent.add(o);return o}
function cylinder(parent,m,x,y,z,r1,r2,h){const o=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,20),m);o.position.set(x,y,z);parent.add(o);return o}
function makeChar(id){const root=new THREE.Group(),parts={};let fur=mats.white;
if(id==='song')fur=mats.gray;if(id==='deer')fur=mats.cream;if(id==='cat')fur=mats.dark;if(id==='duck')fur=mats.white;if(id==='dog')fur=mats.white;
const head=oval(root,fur,0,1.42,0,.68,.63,.57);const body=oval(root,id==='duck'?mats.red:fur,0,.64,0,.47,.56,.37);
for(const sign of [-1,1]){const leg=new THREE.Group();leg.position.set(sign*.28,.31,0);root.add(leg);oval(leg,id==='song'?mats.yellow:id==='deer'?mats.brown:id==='duck'?mats.orange:fur,0,-.11,.06,.22,.25,.26);parts[sign<0?'leftLeg':'rightLeg']=leg;
const arm=new THREE.Group();arm.position.set(sign*.45,.94,.03);root.add(arm);oval(arm,id==='deer'?mats.brown:id==='duck'?mats.white:fur,sign*.15,-.12,.18,.25,.33,.24);parts[sign<0?'leftArm':'rightArm']=arm;}
const eyeY=1.51;
for(const sign of [-1,1]){oval(root,id==='song'?mats.brown:mats.black,sign*.25,eyeY,.51,.105,.13,.055);oval(root,mats.white,sign*.28,eyeY+.045,.557,.027,.035,.012)}
if(id==='song'){oval(root,mats.pink,-.45,1.23,.39,.11,.085,.05);oval(root,mats.pink,.45,1.23,.39,.11,.085,.05);oval(root,mats.pink,0,1.18,.54,.12,.07,.025);oval(root,mats.brown,0,1.25,.555,.17,.025,.02)}
if(id==='deer'){for(const sign of [-1,1]){oval(root,fur,sign*.56,1.83,.01,.23,.29,.14);oval(root,mats.pink,sign*.58,1.84,.14,.14,.19,.035);const antler=cylinder(root,mats.brown,sign*.30,2.17,-.02,.085,.09,.45);antler.rotation.z=sign*.24;const twig=cylinder(root,mats.brown,sign*.41,2.3,0,.055,.06,.24);twig.rotation.z=-sign*.75}oval(root,mats.white,0,1.28,.52,.26,.2,.13);oval(root,mats.brown,0,1.37,.65,.09,.07,.06);oval(root,mats.brown,0,.66,.38,.09,.13,.015)}
if(id==='cat'){for(const sign of [-1,1]){const ear=new THREE.Mesh(new THREE.ConeGeometry(.29,.64,4),fur);ear.position.set(sign*.42,2.02,0);ear.rotation.y=Math.PI/4;root.add(ear);const inner=new THREE.Mesh(new THREE.ConeGeometry(.15,.38,4),mats.pink);inner.position.set(sign*.42,2.02,.15);inner.rotation.y=Math.PI/4;root.add(inner)}oval(root,mats.pink,0,1.33,.56,.075,.05,.05);oval(root,mats.yellow,.38,.74,-.29,.3,.33,.2);for(const sign of [-1,1]){for(let j=-1;j<=1;j++){const whisk=new THREE.Mesh(new THREE.CylinderGeometry(.009,.009,.27,6),mats.white);whisk.position.set(sign*.53,1.30+j*.10,.42);whisk.rotation.z=sign*(Math.PI/2+j*.15);root.add(whisk)}}}
if(id==='duck'){const hat=cylinder(root,mats.dark,0,1.88,-.05,.54,.46,.63);oval(root,mats.orange,0,1.21,.55,.26,.13,.22);for(let j=0;j<3;j++)oval(root,mats.yellow,0,.84-j*.22,.38,.045,.045,.035)}
if(id==='dog'){for(const sign of [-1,1]){const ear=oval(root,mats.cream,sign*.65,1.47,-.04,.29,.51,.2);ear.rotation.z=sign*.25}oval(root,mats.cream,0,1.19,.48,.27,.20,.13);oval(root,mats.brown,0,1.28,.61,.10,.075,.05);for(const sign of [-1,1])oval(root,mats.pink,sign*.43,1.24,.40,.085,.06,.03)}
if(id==='song'){oval(root,mats.gray,0,2.08,0,.11,.14,.11)}
root.userData.parts=parts;return root}
function choose(id){selected=id;for(const b of picker.children)b.classList.toggle('active',b.textContent.includes(names.find(n=>n[0]===id)[2]));if(character)holder.remove(character);if(mixer){mixer.stopAllAction();mixer=null}rig=null;character=null;if(id==='rizco'){new GLTFLoader().load('./rizco_punch.glb',g=>{if(selected!=='rizco')return;character=g.scene;holder.add(character);mixer=new THREE.AnimationMixer(character);if(g.animations.length)mixer.clipAction(g.animations[0]).play();document.querySelector('#status').textContent='● 리즈코 준비 완료'},undefined,()=>{document.querySelector('#status').textContent='모델 로딩 실패 · HTTPS 확인'})}else{character=makeChar(id);rig=character.userData.parts;holder.add(character);document.querySelector('#status').textContent='● '+names.find(n=>n[0]===id)[2]+' 준비 완료'}px=pz=heading=0;holder.rotation.y=0}
choose('rizco');
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}addEventListener('resize',resize);resize();
let vx=0,vy=0,pointer=null;const joy=document.querySelector('#joy'),stick=document.querySelector('#stick');function updateJoy(e){const r=joy.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),len=Math.hypot(dx,dy),max=40,ratio=len>max?max/len:1;const x=dx*ratio,y=dy*ratio;vx=x/max;vy=y/max;stick.style.transform=`translate(${x}px,${y}px)`}function release(){pointer=null;vx=vy=0;stick.style.transform='translate(0,0)'}joy.addEventListener('pointerdown',e=>{pointer=e.pointerId;joy.setPointerCapture(pointer);updateJoy(e)});joy.addEventListener('pointermove',e=>{if(e.pointerId===pointer)updateJoy(e)});joy.addEventListener('pointerup',release);joy.addEventListener('pointercancel',release);
document.querySelector('#reset').onclick=()=>{px=pz=heading=0};document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b))});
document.querySelector('#camera').onclick=async()=>{if(video.srcObject){video.srcObject.getTracks().forEach(t=>t.stop());video.srcObject=null;video.style.display='none';document.querySelector('#camera').innerHTML='카메라<br>켜기';return}try{video.srcObject=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});video.style.display='block';await video.play();document.querySelector('#camera').innerHTML='카메라<br>끄기'}catch(e){document.querySelector('#status').textContent='카메라 권한 또는 HTTPS를 확인해 줘'}};
function tick(){requestAnimationFrame(tick);const dt=Math.min(clock.getDelta(),.05),moving=Math.hypot(vx,vy)>.12;if(moving){px+=vx*dt*1.65;pz+=vy*dt*1.3;px=THREE.MathUtils.clamp(px,-2.4,2.4);pz=THREE.MathUtils.clamp(pz,-2,2);const desired=Math.atan2(vx,-vy);let diff=Math.atan2(Math.sin(desired-heading),Math.cos(desired-heading));heading+=diff*Math.min(1,dt*10);walkPhase+=dt*15}holder.position.set(px,0,pz);holder.rotation.y=heading;ground.position.set(px,-.015,pz);if(character){character.position.y=moving?Math.abs(Math.sin(walkPhase))*0.075:Math.sin(performance.now()/550)*.012;character.rotation.z=moving?Math.sin(walkPhase)*.055:(mode==='punch'?Math.sin(performance.now()/1000*15)*.085:0);character.rotation.x=(!moving&&mode==='punch')?Math.max(0,Math.sin(performance.now()/1000*15))*.075:0;if(rig){const t=performance.now()/1000, punch=!moving&&mode==='punch';const swing=moving?Math.sin(walkPhase)*.58:0;rig.leftLeg.rotation.x=swing;rig.rightLeg.rotation.x=-swing;rig.leftArm.rotation.x=moving?-swing*.75:(punch?-.25-Math.max(0,Math.sin(t*15))*.95:0);rig.rightArm.rotation.x=moving?swing*.75:(punch?-.25-Math.max(0,Math.sin(t*15+Math.PI))*.95:0);rig.leftArm.rotation.z=punch?-.25:0;rig.rightArm.rotation.z=punch?.25:0;}if(mixer){mixer.timeScale=moving?.35:(mode==='punch'?1.55:0);mixer.update(dt)}}renderer.render(scene,cam)}tick();
</script></body></html>
